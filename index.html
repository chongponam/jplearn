body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

img{max-width:100%}

<title>오늘의 단어장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: single narrow column — header with streak, big flip card, deck strip, quiz panel */
:root{
  --bg:#ECEFF3; --paper:#F8F9FB; --ink:#1E2740; --muted:#5D6880; --line:#D3D9E3;
  --ai:#2E4A7D; --ai-soft:#DCE4F1; --shu:#C2412F; --ok:#2F7D5B; --ok-soft:#DCEFE5; --bad-soft:#F6DFDA;
  --f-jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161F; --paper:#1A2030; --ink:#E6EAF2; --muted:#98A2B8; --line:#2C3448;
  --ai:#8EA9DA; --ai-soft:#24304A; --shu:#E2705E; --ok:#6FC39C; --ok-soft:#1E3A2E; --bad-soft:#3E2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161F; --paper:#1A2030; --ink:#E6EAF2; --muted:#98A2B8; --line:#2C3448;
  --ai:#8EA9DA; --ai-soft:#24304A; --shu:#E2705E; --ok:#6FC39C; --ok-soft:#1E3A2E; --bad-soft:#3E2420; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.date{font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--f-jp);font-size:28px;margin:0;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-top:2px}
.stamp{width:64px;height:64px;border:2px solid var(--shu);color:var(--shu);border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-jp);transform:rotate(-8deg);line-height:1.1;font-variant-numeric:tabular-nums}
.stamp b{font-size:22px;display:block}.stamp span{font-size:10px}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ai);color:var(--paper)}
button:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.progress{display:flex;gap:6px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.seen{background:var(--ai-soft)}.progress i.known{background:var(--ok)}.progress i.cur{background:var(--ai)}
.card{perspective:1200px;cursor:pointer;min-height:300px}
.inner{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
.back{transform:rotateY(180deg)}
.lvl{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
.count{position:absolute;top:14px;right:16px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.word{font-family:var(--f-jp);font-size:56px;font-weight:700;line-height:1.15}
.hint{font-size:12px;color:var(--muted)}
.reading{font-family:var(--f-jp);font-size:22px;color:var(--ai)}
.mean{font-size:22px;font-weight:700}
.ex{margin-top:8px;padding-top:12px;border-top:1px dashed var(--line);width:100%}
.ex .jp{font-family:var(--f-jp);font-size:17px}.ex .ko{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px;font:500 14px var(--f-body);cursor:pointer}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--paper)}
.btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.4;cursor:default}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.list h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0;padding:14px 16px 6px;font-weight:500}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:10px 16px;border-top:1px solid var(--line)}
.item .w{font-family:var(--f-jp);font-size:18px;font-weight:700}
.item .r{font-size:13px;color:var(--muted)}
.item .m{min-width:0}
.dot{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ai-soft);color:var(--ai);white-space:nowrap}
.dot.k{background:var(--ok-soft);color:var(--ok)}
.quiz{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px}
.q{text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:14px 10px;font:500 15px var(--f-body);cursor:pointer}
.opts button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--shu);color:var(--shu)}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.big{font-family:var(--f-jp);font-size:48px;font-weight:700;color:var(--ai);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);text-align:center}
.lv{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lv button{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:99px;padding:4px 14px;font:500 13px var(--f-body);cursor:pointer}
.lv button[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.exbtn{margin-top:8px;border:1px solid var(--line);background:none;color:var(--ai);border-radius:99px;padding:4px 12px;font:500 12px var(--f-body);cursor:pointer}
.tts{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);text-align:center}
.tts #ttsmsg{color:var(--shu)}
.tts a{color:var(--ai)}
@media (max-width:420px){.word{font-size:46px}.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="date" id="date"></div>
      <h1>今日の単語<small>오늘의 일본어 단어 8개</small></h1>
    </div>

  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-study" aria-selected="true">카드 학습</button>
    <button role="tab" id="t-quiz" aria-selected="false">퀴즈</button>
    <button role="tab" id="t-list" aria-selected="false">오늘 목록</button>
  </div>

  <div class="lv" id="lvbox"><span>급수</span>
    <button data-lv="N5" aria-pressed="true">N5</button>
    <button data-lv="N4" aria-pressed="true">N4</button>
    <button data-lv="N3" aria-pressed="true">N3</button>
  </div>

  <section id="v-study">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="progress" id="prog"></div>
      <div class="card" id="card" tabindex="0" aria-label="카드를 눌러 뒤집기">
        <div class="inner">
          <div class="face front"><span class="lvl" id="lvl"></span><span class="count" id="cnt"></span>
            <div class="word" id="fw"></div><div class="hint">탭해서 뜻 보기</div></div>
          <div class="face back"><span class="lvl" id="lvl2"></span>
            <div class="reading" id="br"></div><div class="mean" id="bm"></div>
            <div class="ex"><div class="jp" id="bej"></div><div class="ko" id="bek"></div>
              <button class="exbtn" id="speakex">예문 듣기</button></div></div>
        </div>
      </div>
      <div class="row">
        <button class="btn" id="prev">이전</button>
        <button class="btn" id="speak">발음 듣기</button>
        <button class="btn good" id="know">외웠어요</button>
        <button class="btn primary" id="next">다음</button>
      </div>
      <div class="tts"><span id="ttsmsg" hidden></span>
        <a id="gt" href="https://translate.google.com/" target="_blank" rel="noopener">소리가 안 나면 Google 번역에서 듣기 ↗</a></div>
    </div>
  </section>

  <section id="v-quiz" hidden><div class="quiz" id="quiz"></div></section>

  <section id="v-list" hidden><div class="list" id="list"></div></section>

  <p class="note">매일 날짜가 바뀌면 새 단어 8개가 나와요. 진도는 이 브라우저에 저장됩니다.</p>
</div>

["懐かしい","なつかしい","그립다","この歌は懐かしい。","이 노래를 들으니 옛날 생각이 난다.","N3"],["増える","ふえる","늘다","観光客が増えた。","관광객이 늘었다.","N3"],
["減る","へる","줄다","体重が減った。","체중이 줄었다.","N3"],["慣れる","なれる","익숙해지다","生活に慣れた。","생활에 익숙해졌다.","N3"],
["避ける","さける","피하다","混雑を避ける。","혼잡을 피한다.","N3"],["譲る","ゆずる","양보하다","席を譲る。","자리를 양보한다.","N3"],
["許す","ゆるす","용서하다","今回は許そう。","이번에는 용서하자.","N3"],["伝える","つたえる","전하다","よろしく伝えてください。","안부 전해 주세요.","N3"],
["迷う","まよう","헤매다, 망설이다","道に迷った。","길을 잃었다.","N3"],["間に合う","まにあう","제시간에 대다","電車に間に合った。","전철 시간에 늦지 않았다.","N3"],
["やっと","やっと","겨우, 드디어","やっと終わった。","드디어 끝났다.","N3"],["ずいぶん","ずいぶん","꽤, 상당히","ずいぶん寒くなった。","꽤 추워졌다.","N3"],
["なるべく","なるべく","가능한 한","なるべく早く来て。","가능한 한 빨리 와.","N3"],["例えば","たとえば","예를 들면","例えば、これです。","예를 들면 이것입니다.","N3"]
].map(a=>({w:a[0],r:a[1],m:a[2],ej:a[3],ek:a[4],lv:a[5]}));

const N=8, $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const now=new Date(), todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const dayNum=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/864e5);
let today=[];
$("date").textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · ${"日月火水木金土"[now.getDay()]}曜日`;

let S={known:[],days:[],levels:["N5","N4","N3"]};
try{const s=JSON.parse(localStorage.getItem("tango-v1"));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem("tango-v1",JSON.stringify(S))}catch(e){}};
function markDay(){if(!S.days.includes(todayKey)){S.days.push(todayKey);save()}renderStreak()}
function renderStreak(){
  let n=0,d=new Date(now);
  const k=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
  if(!S.days.includes(k(d)))d.setDate(d.getDate()-1);
  while(S.days.includes(k(d))){n++;d.setDate(d.getDate()-1)}
  $("streak").textContent=n;
}

let idx=0; const seen=new Set([0]);
// rotate through the chosen levels so each day gets a fresh set of 8
function buildToday(){
  const deck=W.filter(w=>S.levels.includes(w.lv));
  today=Array.from({length:N},(_,i)=>deck[((dayNum*N)+i)%deck.length]);
  idx=0;seen.clear();seen.add(0);
  document.querySelectorAll("#lvbox button").forEach(b=>b.setAttribute("aria-pressed",S.levels.includes(b.dataset.lv)));
}
document.querySelectorAll("#lvbox button").forEach(b=>b.onclick=()=>{
  const lv=b.dataset.lv,on=S.levels.includes(lv);
  if(on&&S.levels.length===1)return;
  S.levels=on?S.levels.filter(x=>x!==lv):[...S.levels,lv];save();buildToday();show("study");renderCard();
});

// pronunciation: pick a Japanese voice explicitly and read the kana so kanji aren't misread
let jaVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang)&&/google|kyoko|o-ren|haruka|nanami/i.test(x.name))||v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function speakFail(msg){$("ttsmsg").textContent=msg+" 아래 링크로 들어 보세요.";$("ttsmsg").hidden=false}
function speak(text){
  $("ttsmsg").hidden=true;
  if(!("speechSynthesis" in window)){speakFail("이 브라우저는 음성 읽기를 지원하지 않아요.");return}
  loadVoices();
  if(!jaVoice&&speechSynthesis.getVoices().length){speakFail("이 기기에 일본어 음성이 설치되어 있지 않아요.");return}
  try{
    speechSynthesis.cancel();
    setTimeout(()=>{
      const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.rate=.8;
      let started=false;u.onstart=()=>started=true;u.onerror=()=>speakFail("소리를 재생하지 못했어요.");
      speechSynthesis.speak(u);speechSynthesis.resume();
      setTimeout(()=>{if(!started&&!speechSynthesis.speaking)speakFail("소리가 나지 않았어요.")},1800);
    },80);
  }catch(e){speakFail("소리를 재생하지 못했어요.")}
}
function renderCard(){
  const w=today[idx];$("card").classList.remove("flip");
  $("fw").textContent=w.w;$("lvl").textContent=$("lvl2").textContent="JLPT "+w.lv;
  $("cnt").textContent=`${idx+1} / ${N}`;
  setTimeout(()=>{$("br").textContent=w.r;$("bm").textContent=w.m;$("bej").textContent=w.ej;$("bek").textContent=w.ek},150);
  $("prev").disabled=idx===0;$("next").textContent=idx===N-1?"퀴즈 풀기":"다음";
  const k=S.known.includes(w.w);$("know").textContent=k?"외움 취소":"외웠어요";
  $("gt").href="https://translate.google.com/?sl=ja&tl=ko&op=translate&text="+encodeURIComponent(w.w);$("ttsmsg").hidden=true;
  $("prog").innerHTML=today.map((t,i)=>`<i class="${i===idx?"cur":S.known.includes(t.w)?"known":seen.has(i)?"seen":""}"></i>`).join("");
}
$("card").onclick=()=>{$("card").classList.toggle("flip");markDay()};
$("card").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();$("card").click()}};
$("prev").onclick=()=>{if(idx>0){idx--;renderCard()}};
$("next").onclick=()=>{if(idx<N-1){idx++;seen.add(idx);renderCard()}else show("quiz")};
$("know").onclick=()=>{const w=today[idx].w;S.known=S.known.includes(w)?S.known.filter(x=>x!==w):[...S.known,w];save();markDay();renderCard()};
$("speak").onclick=()=>speak(today[idx].r);
$("speakex").onclick=e=>{e.stopPropagation();speak(today[idx].ej)};

// quiz
let qi=0,score=0,order=[];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function startQuiz(){qi=0;score=0;order=shuffle(today);renderQ()}
function renderQ(){
  const box=$("quiz");
  if(qi>=N){markDay();
    box.innerHTML=`<div class="result"><div class="hint">오늘의 결과</div><div class="big">${score} / ${N}</div><div>${score===N?"완벽해요! 내일도 만나요.":score>=6?"잘했어요. 틀린 단어만 한 번 더 볼까요?":"카드를 한 번 더 보고 다시 도전해 보세요."}</div></div><div class="row"><button class="btn primary" id="again">다시 풀기</button><button class="btn" id="back">카드로</button></div>`;
    $("again").onclick=startQuiz;$("back").onclick=()=>show("study");return}
  const w=order[qi],wrong=shuffle(W.filter(x=>x.m!==w.m)).slice(0,3),opts=shuffle([w,...wrong]);
  box.innerHTML=`<div class="count" style="color:var(--muted);font-size:12px">${qi+1} / ${N} · 맞힘 ${score}</div><div class="q"><div class="word">${w.w}</div><div class="hint">알맞은 뜻을 고르세요</div></div><div class="opts">${opts.map((o,i)=>`<button id="o${i}" data-m="${o.m}">${o.m}</button>`).join("")}</div>`;
  box.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.m===w.m;if(ok)score++;
    box.querySelectorAll(".opts button").forEach(x=>{x.disabled=true;if(x.dataset.m===w.m)x.classList.add("right")});
    if(!ok)b.classList.add("wrong");
    box.querySelector(".hint").textContent=`${w.r} · ${w.m}`;
    setTimeout(()=>{qi++;renderQ()},ok?700:1500);
  });
}
function renderList(){
  $("list").innerHTML=`<h2>오늘의 단어 · 외운 단어 ${today.filter(t=>S.known.includes(t.w)).length}/${N}</h2>`+today.map(t=>`<div class="item"><span class="w">${t.w}</span><span class="m">${t.m}<div class="r">${t.r}</div></span><span class="dot ${S.known.includes(t.w)?"k":""}">${S.known.includes(t.w)?"외움":"학습 중"}</span></div>`).join("");
}
function show(v){
  ["study","quiz","list"].forEach(x=>{$("v-"+x).hidden=x!==v;$("t-"+x).setAttribute("aria-selected",x===v)});
  if(v==="quiz")startQuiz();if(v==="list")renderList();
}
["study","quiz","list"].forEach(x=>$("t-"+x).onclick=()=>show(x));
buildToday();renderCard();renderStreak();
</script>
</body>
